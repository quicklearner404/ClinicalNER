name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  model:
    name: Real-model integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx huggingface_hub
      - name: Download model from the Hugging Face Hub
        run: python scripts/download_model.py
      - run: pytest tests/test_model_integration.py -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub && python scripts/download_model.py
      - run: docker build -t clinical-ner-api .
      - name: Container serves predictions
        run: |
          docker run -d --name api -p 8000:8000 clinical-ner-api
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 2; done
          curl -sf -X POST localhost:8000/v1/extract \
            -H "Content-Type: application/json" \
            -d '{"text": "Patient developed acute renal failure after starting cisplatin."}' | tee out.json
          grep -q '"cisplatin"' out.json
